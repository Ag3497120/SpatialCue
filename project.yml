name: SpatialCue
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpatialCue:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: SpatialCueWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: SpatialCue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Uses your AirPods head motion to tell when you're looking at your Watch.
        NSAppleMusicUsageDescription: Plays, pauses and skips tracks from the Apple Watch menu.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SC_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  SpatialCueWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ["*.entitlements"]
      - Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: SpatialCue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(SC_BUNDLE_ID)
        WKBackgroundModes: [physical-therapy, workout-processing]
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Recognizes gestures from your wrist and AirPods motion.
        NSHealthShareUsageDescription: Used only to keep the app running in workout mode. No health data is read.
        NSHealthUpdateUsageDescription: Used only to keep the app running in workout mode. No workouts are saved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SC_BUNDLE_ID).watchkitapp
        CODE_SIGN_ENTITLEMENTS: $(SC_WATCH_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
